# Enable AndroidX and auto-convert third-party libraries
android.useAndroidX=true
android.enableJetifier=true

# Enable non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Kotlin K2 Compiler is enabled by default in Narwhal
kotlin.code.style=official

# JVM Heap size configuration for stable Gradle builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.suppressUnsupportedCompileSdk=35,34

